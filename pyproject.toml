[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcrc-engine"
version = "3.1.0"
description = "Lightweight geospatial preprocessing, L2 logistic inference, and multi-date temporal analysis engine for Soybean Red Crown Rot (RCR) from 8-band PlanetScope imagery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Bruno D. P." }
]
keywords = [
    "remote-sensing",
    "plant-pathology",
    "soybean",
    "red-crown-rot",
    "planetscope",
    "precision-agriculture",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "rasterio>=1.3",
    "xarray>=2023.1",
    "rioxarray>=0.14",
    "geopandas>=0.12",
    "shapely>=2.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.6",
]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/BrunoPuglie/rcrc-engine"
Repository = "https://github.com/BrunoPuglie/rcrc-engine.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
